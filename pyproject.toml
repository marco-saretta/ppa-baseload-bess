[project]
name = "ppa-baseload-bess"
version = "0.1.0"
description = "Optimization course project: firming a baseload PPA with a battery energy storage system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0.3",
    "hydra-core>=1.3.6",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ppa_baseload_bess"
module-root = "src"

[tool.ruff]
line-length = 120
