# Hydra configuration. Override config values on the command line, e.g.:
#   uv run python main.py paths.data=/some/other/dir

defaults:
  - paths: default
  - simulations: default
  - _self_

# One scenario:     python main.py simulations=demo
# Several in a row: python main.py --multirun simulations=default,demo
# All of them:      python main.py --multirun 'simulations=glob(*)'
