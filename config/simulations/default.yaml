# Simulation template - copy, rename, and place under config/simulations/
# Reference with:  python main.py simulations=<name>

# --- MAIN RUN CONFIG ----------------------------------------------------------

label: default

# --- SCENARIOS ----------------------------------------------------------------

# Each scenario is `horizon_days` historical days drawn at random (with replacement).
# Use horizon_days: 365 once a full year of 15-minute data is available.
scenarios:
  n_scenarios: 10
  horizon_days: 7
  seed: 42
